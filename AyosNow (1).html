<style>

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}

.wrap{max-width:1100px;margin:0 auto;padding:0 18px}
section{padding:46px 0}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--card);border-bottom:1px solid var(--line)}

footer{background:#0f1b36;color:#cdd7ec;padding:40px 0 30px}footer a{color:#cdd7ec}

.tablewrap{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:560px}th,td{padding:10px;text-align:left;border-bottom:1px solid var(--line);font-size:.9rem;vertical-align:top}th{color:var(--mute);font-weight:700}
.msgs{max-height:260px;overflow:auto;display:flex;flex-direction:column;gap:8px;padding:6px 0}
.msg{max-width:80%;padding:9px 13px;border-radius:14px;background:var(--blue-l);align-self:flex-start;font-size:.93rem}.msg.me{background:var(--blue);color:#fff;align-self:flex-end}
.bar{height:10px;background:var(--blue-l);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--blue)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#14213d;color:#fff;padding:12px 20px;border-radius:14px;z-index:99;box-shadow:var(--sh);max-width:92vw;font-weight:600}

.narrow{max-width:560px;margin:0 auto}
.center{text-align:center}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>

<header class="top"><div class="wrap">
  <div class="nav">
    <a class="logo" href="#/" aria-label="AyosNow home"><svg viewBox="0 0 32 32"><rect width="32" height="32" rx="9" fill="#1d5fd1"/><path d="M21.5 6.5a5.5 5.5 0 0 0-5.2 7.2L7.6 22.4a2 2 0 0 0 2.8 2.8l8.7-8.7a5.5 5.5 0 0 0 7.2-5.2l-3.3 3.3-2.6-.6-.6-2.6z" fill="#fff"/></svg>AyosNow</a>

<main id="app"></main>
<footer><div class="wrap">

  <div class="fl"><a href="#/">Home</a><a href="#/services">Services</a><a href="#/how">How It Works</a><a href="#/track">Track Request</a><a href="#/about">About</a><a href="#/contact">Contact</a><a href="#/faq">FAQ</a><a href="#/privacy">Privacy Policy</a><a href="#/terms">Terms &amp; Conditions</a></div>

<script>
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const fmt=t=>new Date(t).toLocaleString('en-PH',{dateStyle:'medium',timeStyle:'short'});
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),3200)}
let memStore={};
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return memStore[k]??null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){memStore[k]=v}},del(k){try{localStorage.removeItem(k)}catch(e){delete memStore[k]}}};

/* ---------- data ---------- */
const DEFAULT_CATS=[
['electrical','⚡','Electrical','Wires, outlets, switches, lights','electrician wiring outlet switch light'],
['plumbing','🚰','Plumbing','Leaking pipes, faucets, clogged drains','plumber leak pipe faucet drain'],
['aircon','❄️','Aircon & Cooling','Aircon and electric fan problems','aircon ac cooling fan'],
['appliance','🔧','Appliance Repair','Refrigerator, washing machine, TV, etc.','appliance refrigerator washing machine tv'],
['computer','💻','Phone & Computer','Broken phones, computers, software problems','phone computer laptop software cellphone'],
['wifi','📶','Internet & Wi-Fi','Router and connection problems','internet wifi router connection'],
['vehicle','🚗','Vehicle Assistance','Flat tire, battery problems, minor roadside assistance','car vehicle tire battery roadside'],
['home','🏠','Home Repair','Doors, roofs, ceilings, tiles, walls','door roof ceiling tiles wall mason'],
['carpentry','🔨','Carpentry','Cabinets, furniture, shelves','carpenter cabinet furniture shelf'],
['painting','🎨','Painting','Wall and house painting','paint painter wall'],
['cleaning','🧹','Cleaning','House and room cleaning','clean cleaner maid'],
['gardening','🌳','Gardening','Grass cutting and garden maintenance','garden grass lawn'],
['locksmith','🔑','Locksmith','Locks and key-related problems','lock key locksmith'],
['other','🛠️','Other Services','Problems that do not fit the categories','other']
].map(([id,icon,title,desc,kw])=>({id,icon,title,desc,kw,active:true}));
const STEPS=[['received','Request Received',"The system received the user's request."],['finding','Finding Technician','The system is looking for an available technician.'],['accepted','Technician Accepted','A technician accepted the request.'],['enroute','Technician On the Way',"The technician is going to the customer's location."],['completed','Repair Completed','The service has been completed.']];
const SAMPLE_REVIEWS=[['Maria S.',5,'Plumbing','I uploaded a photo of my leaking pipe and quickly found a plumber.'],['Jon R.',5,'Aircon & Cooling','Nakita agad ng technician sa picture kung anong sira. Mabilis at malinis ang trabaho.'],['Liza P.',4,'Internet & Wi-Fi','Easy to use on my phone. I just took a photo of my router and described the problem.']];

const S={users:[],requests:[],cats:DEFAULT_CATS,cfg:{email:'support@ayosnow.example',phone:'0900 000 0000'},db:null,mode:'local',isOwner:false,uid:null,ready:false};
let route='',sess=ls.get('ayos_sess'),adminTab='overview',techTab='dashboard',custTab='requests',tFilter={cat:'',loc:'',urg:'',avail:''},finder={q:'',cat:'',loc:'',avail:''};
const me=()=>S.users.find(u=>u.id===sess);
const catOf=id=>S.cats.find(c=>c.id===id)||{icon:'🛠️',title:'Other Services'};
const isAdmin=()=>S.isOwner||(S.mode==='local');

async function initStore(){
  let db=null,user=null;
  try{if(window.claude){db=await claude.use('db');user=await claude.use('user');}}catch(e){}
  S.isOwner=!!(user&&user.isOwner&&user.isOwner());
  if(db){
    S.db=db;S.mode='cloud';
    try{S.uid=user&&user.id?await user.id():null}catch(e){}
    const sub=(path,fn)=>db.collection(path).onSnapshot(q=>{fn(q.docs.map(d=>({id:d.id,...d.data()})));if(S.ready)render(true)},()=>{});
    sub('users',a=>S.users=a);
    sub('requests',a=>S.requests=a.sort((x,y)=>y.createdAt-x.createdAt));
    db.doc('config/main').onSnapshot(d=>{const v=d.data();if(v){if(v.cats)S.cats=v.cats;if(v.cfg)S.cfg=v.cfg;}if(S.ready)render(true)},()=>{});
  }else{
    try{const d=JSON.parse(ls.get('ayos_db')||'{}');S.users=d.users||[];S.requests=d.requests||[];S.cats=d.cats||DEFAULT_CATS;S.cfg=d.cfg||S.cfg}catch(e){}
  }
  S.ready=true;
}
function persistLocal(){ls.set('ayos_db',JSON.stringify({users:S.users,requests:S.requests,cats:S.cats,cfg:S.cfg}))}
async function put(col,obj){
  const arr=col==='users'?S.users:S.requests;
  const i=arr.findIndex(x=>x.id===obj.id);
  if(i>=0)arr[i]=obj;else arr.unshift(obj);
  if(S.db){
    const {id,...body}=obj;
    try{await S.db.doc(col+'/'+id).set(JSON.parse(JSON.stringify(body)));return true}
    catch(e){toast("Couldn't save. This page needs contributor access to store data.");return false}
  }
  persistLocal();return true;
}
async function saveConfig(){
  if(S.db){try{await S.db.doc('config/main').set({cats:S.cats,cfg:S.cfg})}catch(e){toast("Couldn't save settings.")}}else persistLocal();
}
async function hash(email,pw){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('ayos|'+email.toLowerCase()+'|'+pw));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
function compress(file,max=900,q=.72){return new Promise((res,rej)=>{const r=new FileReader();r.onerror=rej;r.onload=()=>{const im=new Image();im.onerror=rej;im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',q))};im.src=r.result};r.readAsDataURL(file)})}
function dist(a,b){if(!a||!b||a.lat==null||b.lat==null)return null;const R=6371,t=x=>x*Math.PI/180,dl=t(b.lat-a.lat),dn=t(b.lng-a.lng),h=Math.sin(dl/2)**2+Math.cos(t(a.lat))*Math.cos(t(b.lat))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
function getGPS(cb){if(!navigator.geolocation)return toast('Location is not available on this device.');navigator.geolocation.getCurrentPosition(p=>cb({lat:+p.coords.latitude.toFixed(5),lng:+p.coords.longitude.toFixed(5)}),()=>toast('Could not get your location. You can type it instead.'),{timeout:10000})}

/* ---------- nav ---------- */
function navLinks(){
  const u=me();
  const base=[['#/','Home'],['#/services','Services'],['#/how','How It Works'],['#/track','Track Request']];
  let acct=u?`<a href="#/dashboard">${u.role==='technician'?'Technician':u.role==='admin'?'Admin':'My Account'}</a><a href="#" onclick="logout();return false">Logout</a>`:`<a href="#/login">Login</a><a href="#/signup">Sign Up</a>`;
  if(!u&&isAdmin())acct+=`<a href="#/admin">Admin</a>`;
  const cta=`<a class="btn sm" href="#/request">Get Help</a>`;
  const html=base.map(([h,t])=>`<a href="${h}">${t}</a>`).join('')+acct;
  $('#links').innerHTML=html+cta;
  $('#mnav').innerHTML=html+`<a class="btn" style="margin-top:12px;color:#fff" href="#/request">Get Help</a>`;
}
$('#burger').onclick=()=>{const o=$('#mnav').classList.toggle('open');$('#burger').setAttribute('aria-expanded',o)};
function logout(){sess=null;ls.del('ayos_sess');location.hash='#/';render()}

/* ---------- views ---------- */
const heroSVG=`<svg viewBox="0 0 420 340" role="img" aria-label="Person taking a photo of a leaking faucet" style="width:100%;height:auto"><rect x="10" y="20" width="400" height="300" rx="28" fill="var(--card)" stroke="var(--line)"/><rect x="250" y="70" width="110" height="14" rx="7" fill="#9fb1cc"/><rect x="262" y="84" width="16" height="50" rx="4" fill="#9fb1cc"/><path d="M262 134q0 14 14 14h36" stroke="#9fb1cc" stroke-width="14" fill="none" stroke-linecap="round"/><rect x="300" y="150" width="16" height="14" fill="#7d90af"/><path d="M308 176c-9 14-9 22 0 22s9-8 0-22z" fill="#3b8bff"/><path d="M308 214c-7 10-7 17 0 17s7-6 0-17z" fill="#3b8bff" opacity=".7"/><ellipse cx="308" cy="290" rx="52" ry="10" fill="#3b8bff" opacity=".25"/><circle cx="110" cy="112" r="30" fill="#f2c9a0"/><path d="M80 108a30 30 0 0 1 60 0c-14-8-44-8-60 0z" fill="#14213d"/><path d="M62 300v-76a48 48 0 0 1 96 0v76z" fill="#1d5fd1"/><path d="M150 232l50-52" stroke="#f2c9a0" stroke-width="16" stroke-linecap="round"/><g transform="rotate(-14 200 150)"><rect x="176" y="96" width="62" height="100" rx="12" fill="#14213d"/><rect x="182" y="104" width="50" height="78" rx="6" fill="#dbe9ff"/><circle cx="207" cy="143" r="16" fill="none" stroke="#1d5fd1" stroke-width="4"/><circle cx="207" cy="143" r="5" fill="#1d5fd1"/></g><path d="M246 128l18-8M246 150h22M246 172l18 8" stroke="#16a34a" stroke-width="4" stroke-linecap="round" stroke-dasharray="1 8"/></svg>`;

function catCards(list){return list.length?list.map(c=>`<button class="cat" onclick="pickCat('${c.id}')"><span class="ic">${c.icon}</span><span><b>${esc(c.title)}</b><span class="d">${esc(c.desc)}</span></span></button>`).join(''):`<div class="empty">No service matched. Try “Other Services”.</div>`}
function pickCat(id){location.hash='#/request';setTimeout(()=>{const s=$('#r_cat');if(s)s.value=id;window.scrollTo({top:0,behavior:'smooth'})},50)}
function filterCats(){
  const q=($('#svq')?.value||'').toLowerCase().trim();
  const list=S.cats.filter(c=>c.active!==false&&(!q||(c.title+' '+c.desc+' '+(c.kw||'')).toLowerCase().includes(q)));
  $('#catgrid').innerHTML=catCards(list);
  finder.q=q;renderFinder();
}
function renderFinder(){
  const el=$('#finder');if(!el)return;
  const f={cat:$('#fc')?.value||'',loc:($('#fl')?.value||'').toLowerCase().trim(),av:$('#fa')?.value||''};

async function onPhoto(inp){

  const id='AYOS-'+String(Math.floor(100000+Math.random()*900000));
  const now=Date.now();
  const r={id,uid:sess||null,name:$('#r_name').value.trim(),phone:$('#r_phone').value.trim(),cat:$('#r_cat').value,photo:pendingPhoto||'',desc:$('#r_desc').value.trim(),house:$('#r_house').value.trim(),brgy:$('#r_brgy').value.trim(),city:$('#r_city').value.trim(),note:$('#r_note').value.trim(),geo:pendingGPS||null,sched:$('#r_sched').value,urgency:document.querySelector('input[name=urg]:checked').value,status:'finding',history:[{s:'received',t:now},{s:'finding',t:now+1}],createdAt:now,techId:null,declined:[],messages:[]};
  $('#subbtn').disabled=true;
  const ok=await put('requests',r);
  $('#subbtn').disabled=false;

}

  return `<div class="wrap" style="padding:34px 18px"><div class="narrow"><div class="card">

function timeline(r){

  <div class="grid g2" style="margin-top:12px;align-items:start">
  <div class="card rq"><div class="row" style="justify-content:space-between"><h3 style="margin:0">${r.id}</h3>${statusBadge(r.status)}</div>
  ${r.photo?`<img class="th" style="height:auto;max-height:340px" src="${r.photo}" alt="Problem photo">`:''}
  <div>${catOf(r.cat).icon} <b>${esc(catOf(r.cat).title)}</b> ${r.urgency==='Urgent'?'<span class="badge warn">Urgent</span>':''}</div>
  <p style="margin:0">${esc(r.desc)}</p>
  <div class="meta">📍 ${esc(addr(r,reveal))}${d!=null?` · ${d.toFixed(1)} km away`:''}</div>
  ${r.geo?`<a class="btn sm ghost" target="_blank" rel="noopener" href="https://www.google.com/maps?q=${r.geo.lat},${r.geo.lng}">Open map</a>`:''}
  <div class="meta">🗓️ Preferred: ${r.sched?fmt(r.sched):'Anytime'} · Submitted ${fmt(r.createdAt)}</div>
  ${reveal?`<hr style="border:0;border-top:1px solid var(--line);width:100%"><div><b>${esc(r.name)}</b><br><a href="tel:${esc(r.phone)}">${esc(r.phone)}</a></div>`:`<div class="note">Customer name, phone and exact address are shared after you accept this job.</div>`}
  ${isTech&&!r.techId&&r.status==='finding'&&u.status==='approved'?`<div class="row"><button class="btn ok" onclick="acceptJob('${r.id}')">Accept Job</button><button class="btn bad ghost" onclick="declineJob('${r.id}')">Decline</button></div>`:''}
  ${isTech&&u.status!=='approved'?`<div class="note">Your account must be approved before you can accept jobs.</div>`:''}
  ${mineTech&&r.status==='accepted'?`<button class="btn" onclick="setStatus('${r.id}','enroute')">I'm on the way</button>`:''}
  ${mineTech&&r.status==='enroute'?`<button class="btn ok" onclick="setStatus('${r.id}','completed')">Mark repair completed</button>`:''}
  ${mineCust&&['received','finding','accepted'].includes(r.status)?`<button class="btn bad ghost" onclick="cancelReq('${r.id}')">Cancel request</button>`:''}
  </div>
  <div class="grid">
   <div class="card"><h3>Progress</h3>${timeline(r)}${tech?`<div class="note" style="background:var(--blue-l)">👨‍🔧 ${esc(tech.name)} · ${esc(tech.phone)}</div>`:''}${mineCust&&canReview(r)?reviewBox(r):''}</div>
   ${(mineTech||mineCust)&&tech?`<div class="card"><h3>Messages</h3><div class="msgs" id="msgs">${(r.messages||[]).map(m=>`<div class="msg ${m.from===u.id?'me':''}">${esc(m.text)}</div>`).join('')||'<div class="meta">No messages yet.</div>'}</div><div class="row" style="flex-wrap:nowrap"><input id="mtext" placeholder="Write a message" onkeydown="if(event.key==='Enter')sendMsg('${r.id}')"><button class="btn" onclick="sendMsg('${r.id}')">Send</button></div></div>`:''}
  </div></div></div>`;
}
async function sendMsg(id){const t=$('#mtext').value.trim();if(!t)return;const r=S.requests.find(x=>x.id===id);r.messages=[...(r.messages||[]),{from:sess,text:t,t:Date.now()}];$('#mtext').value='';await put('requests',r);render()}
async function acceptJob(id){const r=S.requests.find(x=>x.id===id);if(r.techId)return toast('Another technician already took this job.');r.techId=sess;r.status='accepted';r.history.push({s:'accepted',t:Date.now()});if(await put('requests',r)){toast('Job accepted!');render()}}
async function declineJob(id){const r=S.requests.find(x=>x.id===id);r.declined=[...(r.declined||[]),sess];await put('requests',r);location.hash='#/dashboard';render()}
async function setStatus(id,s){const r=S.requests.find(x=>x.id===id);r.status=s;r.history.push({s,t:Date.now()});await put('requests',r);render()}

/* technician dashboard */
function techView(u){
  const tabs=[['dashboard','Dashboard'],['available','Available Requests'],['jobs','My Jobs'],['messages','Messages'],['profile','Profile']];
  const mine=S.requests.filter(r=>r.techId===u.id);
  const avail=S.requests.filter(r=>r.status==='finding'&&!r.techId&&!(r.declined||[]).includes(u.id)&&(!tFilter.cat||r.cat===tFilter.cat)&&(!tFilter.urg||r.urgency===tFilter.urg)&&(!tFilter.loc||addr(r,false).toLowerCase().includes(tFilter.loc.toLowerCase())));
  let body='';
  if(u.status!=='approved')body+=`<div class="note">${u.status==='pending'?'⏳ Your application is waiting for admin approval. You can browse requests, but you cannot accept jobs yet.':u.status==='rejected'?'Your application was not approved. Contact support for details.':'This account is suspended.'}</div>`;
  if(techTab==='dashboard')body+=`<div class="grid g3"><div class="card stat"><b>${avail.length}</b><span>Available requests</span></div><div class="card stat"><b>${mine.filter(r=>!['completed','cancelled'].includes(r.status)).length}</b><span>Active jobs</span></div><div class="card stat"><b>${mine.filter(r=>r.status==='completed').length}</b><span>Completed jobs</span></div></div>`;
  if(techTab==='available'){
    body+=`<div class="grid g3" style="margin-bottom:14px"><div><label for="tf1">Category</label><select id="tf1" onchange="tFilter.cat=this.value;render()"><option value="">All</option>${S.cats.map(c=>`<option value="${c.id}" ${tFilter.cat===c.id?'selected':''}>${c.icon} ${esc(c.title)}</option>`).join('')}</select></div><div><label for="tf2">Urgency</label><select id="tf2" onchange="tFilter.urg=this.value;render()"><option value="">Any</option><option ${tFilter.urg==='Urgent'?'selected':''}>Urgent</option><option ${tFilter.urg==='Normal'?'selected':''}>Normal</option></select></div><div><label for="tf3">Location</label><input id="tf3" value="${esc(tFilter.loc)}" placeholder="Barangay or city" onchange="tFilter.loc=this.value;render()"></div></div>`;
    body+=`<div class="grid g2">${avail.length?avail.map(r=>reqCard(r,u)).join(''):`<div class="card empty">No open requests right now. New ones appear here automatically.</div>`}</div>`;
  }
  if(techTab==='jobs')body+=`<div class="grid g2">${mine.length?mine.map(r=>reqCard(r,u)).join(''):`<div class="card empty">You have no jobs yet.</div>`}</div>`;
  if(techTab==='messages')body+=mine.length?`<div class="grid">${mine.map(r=>{const l=(r.messages||[]).slice(-1)[0];return `<a class="card" href="#/request/${r.id}" style="color:inherit"><b>${r.id} · ${esc(r.name)}</b><div class="meta">${l?esc(l.text):'No messages yet'}</div></a>`}).join('')}</div>`:`<div class="card empty">Messages with customers appear after you accept a job.</div>`;
  if(techTab==='profile')body+=`<div class="card narrow" style="margin:0"><div class="row" style="flex-wrap:nowrap;align-items:center">${u.avatar?`<img src="${u.avatar}" alt="" style="width:72px;height:72px;border-radius:50%;object-fit:cover">`:''}<div><h3 style="margin:0">${esc(u.name)}</h3><div class="meta">${catOf(u.spec).icon} ${esc(catOf(u.spec).title)} · ${u.years} yrs</div></div></div><p style="margin-top:14px">${esc(u.skills)}</p><div class="meta">${esc(u.phone)} · ${esc(u.email)}<br>${esc(u.address)}</div><div class="row" style="margin-top:14px"><button class="btn sm ${u.available!==false?'ok':'ghost'}" onclick="toggleAvail()">${u.available!==false?'🟢 Available':'⚪ Busy'} (tap to change)</button><button class="btn sm ghost" onclick="setTechGeo()">📍 Set my service location</button></div><div class="hint">${u.geo?'Service location set. Distances show on requests.':'Set it to see distance to customers.'}</div></div>`;
  return `<div class="wrap"><div class="dash"><nav class="side" aria-label="Technician">${tabs.map(([k,t])=>`<button class="${techTab===k?'on':''}" onclick="techTab='${k}';render()">${t}</button>`).join('')}<button onclick="logout()">Logout</button></nav><div>${body}</div></div></div>`;
}
function reqCard(r,u){const d=u.geo&&r.geo?dist(u.geo,r.geo):null;return `<div class="card rq">${r.photo?`<img class="th" src="${r.photo}" alt="Problem photo">`:''}<div class="row" style="justify-content:space-between"><b>${r.id}</b>${r.urgency==='Urgent'?'<span class="badge warn">Urgent</span>':statusBadge(r.status)}</div><div>${catOf(r.cat).icon} ${esc(catOf(r.cat).title)}</div><div style="display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden">${esc(r.desc)}</div><div class="meta">📍 ${esc(addr(r,false))}${d!=null?' · '+d.toFixed(1)+' km':''}<br>🕒 ${fmt(r.createdAt)}</div><div class="row"><a class="btn sm ghost" href="#/request/${r.id}">View Details</a>${r.status==='finding'&&!r.techId&&u.status==='approved'?`<button class="btn sm ok" onclick="acceptJob('${r.id}')">Accept Request</button>`:''}</div></div>`}
async function toggleAvail(){const u=me();u.available=u.available===false;await put('users',u);render()}
function setTechGeo(){getGPS(async g=>{const u=me();u.geo=g;await put('users',u);toast('Location saved.');render()})}

/* admin */
function adminView(){
  const T=S.users.filter(u=>u.role==='technician'),C=S.users.filter(u=>u.role==='customer'),R=S.requests;
  const tabs=['overview','users','technicians','requests','categories','reports','settings'];
  let b='';
  const reqRow=r=>{const ts=T.filter(t=>t.status==='approved');return `<tr><td><b>${r.id}</b><br><span class="meta">${fmt(r.createdAt)}</span></td><td>${catOf(r.cat).icon} ${esc(catOf(r.cat).title)}</td><td>${esc(r.name)}<br><span class="meta">${esc(addr(r,false))}</span></td><td>${statusBadge(r.status)}</td><td><select aria-label="Assign technician" onchange="adminAssign('${r.id}',this.value)"><option value="">Assign…</option>${ts.map(t=>`<option value="${t.id}" ${r.techId===t.id?'selected':''}>${esc(t.name)}</option>`).join('')}</select><select aria-label="Update status" style="margin-top:6px" onchange="adminStatus('${r.id}',this.value)"><option value="">Set status…</option>${[...STEPS.map(s=>[s[0],s[1]]),['cancelled','Cancelled']].map(([k,t])=>`<option value="${k}">${t}</option>`).join('')}</select><a class="btn sm ghost" style="margin-top:6px" href="#/request/${r.id}">View</a></td></tr>`};
  if(adminTab==='overview')b=`<div class="grid g3">${[['Total users',C.length],['Total technicians',T.filter(t=>t.status==='approved').length],['Active requests',R.filter(r=>!['completed','cancelled'].includes(r.status)).length],['Completed requests',R.filter(r=>r.status==='completed').length],['Cancelled requests',R.filter(r=>r.status==='cancelled').length],['Pending technician applications',T.filter(t=>t.status==='pending').length]].map(([l,n])=>`<div class="card stat"><b>${n}</b><span>${l}</span></div>`).join('')}</div>`;
  if(adminTab==='users')b=`<div class="card tablewrap"><table><tr><th>Name</th><th>Contact</th><th>Status</th><th></th></tr>${C.map(u=>`<tr><td>${esc(u.name)}</td><td>${esc(u.email)}<br>${esc(u.phone)}</td><td>${u.status==='suspended'?'<span class="badge bad">Suspended</span>':'<span class="badge ok">Active</span>'}</td><td><button class="btn sm ghost ${u.status==='suspended'?'':'bad'}" onclick="adminUser('${u.id}','${u.status==='suspended'?'active':'suspended'}')">${u.status==='suspended'?'Reactivate':'Suspend'}</button></td></tr>`).join('')||'<tr><td colspan=4 class="empty">No customers yet.</td></tr>'}</table></div>`;
  if(adminTab==='technicians')b=`<div class="grid g2">${T.map(t=>`<div class="card"><div class="row" style="flex-wrap:nowrap;align-items:center">${t.avatar?`<img src="${t.avatar}" alt="" style="width:56px;height:56px;border-radius:50%;object-fit:cover">`:''}<div><b>${esc(t.name)}</b><div class="meta">${catOf(t.spec).icon} ${esc(catOf(t.spec).title)} · ${t.years} yrs</div></div></div><p class="meta" style="margin:10px 0">${esc(t.skills)}<br>${esc(t.phone)} · ${esc(t.email)}<br>${esc(t.address)}</p><span class="badge ${t.status==='approved'?'ok':t.status==='pending'?'warn':'bad'}">${t.status}</span><div class="row" style="margin-top:10px"><button class="btn sm ghost" onclick="viewKyc('${t.id}')">View ID${t.hasCert?' & certificate':''}</button>${t.status!=='approved'?`<button class="btn sm ok" onclick="adminUser('${t.id}','approved')">Approve</button>`:''}${t.status==='pending'?`<button class="btn sm bad ghost" onclick="adminUser('${t.id}','rejected')">Reject</button>`:''}${t.status==='approved'?`<button class="btn sm bad ghost" onclick="adminUser('${t.id}','suspended')">Suspend</button>`:''}</div><div id="kyc_${t.id}"></div></div>`).join('')||'<div class="card empty">No technician applications yet.</div>'}</div>`;
  if(adminTab==='requests')b=`<div class="card tablewrap"><table><tr><th>Request</th><th>Service</th><th>Customer</th><th>Status</th><th>Actions</th></tr>${R.map(reqRow).join('')||'<tr><td colspan=5 class="empty">No requests yet.</td></tr>'}</table></div>`;
  if(adminTab==='categories')b=`<div class="card"><div class="row" style="margin-bottom:12px"><input id="nc_i" placeholder="Icon" style="width:80px"><input id="nc_t" placeholder="Category name" style="flex:1;min-width:160px"><input id="nc_d" placeholder="Short description" style="flex:2;min-width:180px"><button class="btn" onclick="addCat()">Add</button></div>${S.cats.map(c=>`<div class="row" style="justify-content:space-between;align-items:center;padding:8px 0;border-top:1px solid var(--line)"><span>${c.icon} <b>${esc(c.title)}</b> <span class="meta">${esc(c.desc)}</span></span><span class="row"><button class="btn sm ghost" onclick="toggleCat('${c.id}')">${c.active!==false?'Hide':'Show'}</button>${DEFAULT_CATS.some(d=>d.id===c.id)?'':`<button class="btn sm bad ghost" onclick="delCat('${c.id}')">Delete</button>`}</span></div>`).join('')}</div>`;
  if(adminTab==='reports'){const mx=Math.max(1,...S.cats.map(c=>R.filter(r=>r.cat===c.id).length));b=`<div class="card"><h3>Requests by service</h3>${S.cats.map(c=>{const n=R.filter(r=>r.cat===c.id).length;return `<div style="margin:10px 0"><div class="row" style="justify-content:space-between"><span>${c.icon} ${esc(c.title)}</span><b>${n}</b></div><div class="bar"><i style="width:${n/mx*100}%"></i></div></div>`}).join('')}<p class="meta">Completion rate: ${R.length?Math.round(R.filter(r=>r.status==='completed').length/R.length*100):0}%</p></div>`}
  if(adminTab==='settings')b=`<div class="card narrow" style="margin:0"><div class="f"><label for="s_e">Support email</label><input id="s_e" value="${esc(S.cfg.email)}"></div><div class="f"><label for="s_p">Support phone</label><input id="s_p" value="${esc(S.cfg.phone)}"></div><button class="btn" onclick="saveSettings()">Save settings</button><p class="hint" style="margin-top:14px">Data mode: ${S.mode==='cloud'?'saved to this page’s shared database':'preview only, saved in this browser'}.</p></div>`;
  return `<div class="wrap"><div class="dash"><nav class="side" aria-label="Admin">${tabs.map(t=>`<button class="${adminTab===t?'on':''}" onclick="adminTab='${t}';render()">${t[0].toUpperCase()+t.slice(1)}</button>`).join('')}</nav><div>${S.mode==='local'?'<div class="note">Preview mode: data is saved only in this browser.</div>':''}${b}</div></div></div>`;
}
async function adminUser(id,s){const u=S.users.find(x=>x.id===id);u.status=s;await put('users',u);render()}
async function adminAssign(id,tid){if(!tid)return;const r=S.requests.find(x=>x.id===id);r.techId=tid;if(['received','finding'].includes(r.status)){r.status='accepted';r.history.push({s:'accepted',t:Date.now()})}await put('requests',r);render()}
async function adminStatus(id,s){if(!s)return;const r=S.requests.find(x=>x.id===id);r.status=s;r.history.push({s,t:Date.now()});await put('requests',r);render()}
async function viewKyc(id){const el=$('#kyc_'+id);let d=null;try{if(S.db){const s=await S.db.doc('kyc/'+id).get();d=s.data()}else d=JSON.parse(ls.get('ayos_kyc_'+id)||'null')}catch(e){}el.innerHTML=d?`<img src="${d.id}" alt="ID" style="width:100%;border-radius:12px;margin-top:10px">${d.cert?`<img src="${d.cert}" alt="Certificate" style="width:100%;border-radius:12px;margin-top:10px">`:''}`:'<div class="meta">No document available.</div>'}
async function addCat(){const t=$('#nc_t').value.trim();if(!t)return;S.cats.push({id:'c'+uid(),icon:$('#nc_i').value||'🛠️',title:t,desc:$('#nc_d').value,kw:t.toLowerCase(),active:true});await saveConfig();render()}
async function toggleCat(id){const c=S.cats.find(x=>x.id===id);c.active=c.active===false;await saveConfig();render()}
async function delCat(id){S.cats=S.cats.filter(x=>x.id!==id);await saveConfig();render()}
async function saveSettings(){S.cfg={email:$('#s_e').value,phone:$('#s_p').value};await saveConfig();toast('Settings saved.')}

/* misc pages */
function textPage(t,body){return `<div class="wrap" style="padding:34px 18px"><div class="narrow" style="max-width:720px"><h2>${t}</h2>${body}</div></div>`}
const pages={
  about:()=>textPage('About AyosNow','<p>AyosNow helps people get household, technical and maintenance problems fixed. Take a photo, describe the problem, and a verified service professional can pick it up.</p>'),
  contact:()=>textPage('Contact',`<p>Email: <a href="mailto:${esc(S.cfg.email)}">${esc(S.cfg.email)}</a><br>Phone: ${esc(S.cfg.phone)}</p>`),
  privacy:()=>textPage('Privacy Policy','<p>We collect the details you give us (name, contact number, photos, location) only to match your request with a service provider. Technicians see only what they need to evaluate a job; your name, number and full address are shared after a technician accepts. Replace this sample text with your official policy before launch.</p>'),
  terms:()=>textPage('Terms &amp; Conditions','<p>AyosNow connects customers with independent service providers. Service agreements, pricing and responsibilities should be confirmed between the customer and the provider. Replace this sample text with your official terms before launch.</p>')
};

/* ---------- router ---------- */
function render(soft){
  if(!S.ready)return;
  if(soft&&document.activeElement&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))return;
  const h=location.hash.replace(/^#/,'')||'/';
  const [,p1,p2]=h.split('/');
  const u=me();navLinks();
  let v='';
  switch(p1){
    case '':v=homeView();break;
    case 'services':case 'how':case 'faq':v=homeView();break;
    case 'request':v=p2?detailView(p2):`<div class="wrap" style="padding:30px 18px"><div class="narrow" style="max-width:720px"><h2>Request a service</h2>${requestForm()}</div></div>`;break;
    case 'confirm':v=confirmView(p2);break;
    case 'track':v=trackView(p2?decodeURIComponent(p2):'');break;
    case 'login':v=authView('login');break;
    case 'signup':v=authView('signup');break;
    case 'tech-signup':v=techSignupView();break;
    case 'dashboard':v=!u?authView('login'):u.role==='technician'?techView(u):customerView(u);break;
    case 'admin':v=isAdmin()?adminView():`<div class="wrap" style="padding:40px 18px"><div class="card empty">Admin access is only for the AyosNow owner. Open this page while signed in to claude.ai as the owner.</div></div>`;break;
    default:v=pages[p1]?pages[p1]():homeView();
  }
  $('#app').innerHTML=v;
  $('#mnav').classList.remove('open');
  if(['services','how','faq'].includes(p1)&&!soft)setTimeout(()=>{document.getElementById(p1)?.scrollIntoView()},30);
  else if(!soft&&p1!==undefined)window.scrollTo(0,0);
  if($('#finder'))renderFinder();
}
window.addEventListener('hashchange',()=>render());
initStore().then(()=>render());
</script>
</body>
